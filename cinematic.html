<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="TaleLoom 影像模式：《雾港旧案：未结的账》。画面与声音由代码实时生成，剧情与核对由同一个 Python 引擎驱动。">
  <title>雾港旧案：未结的账 · 影像模式</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23050506'/%3E%3Ctext x='16' y='46' fill='%23e7ad5f' font-size='40' font-family='serif'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="theater">
    <div class="stagebox">
      <div class="frame" id="frame" tabindex="0" aria-label="剧情画面，点击或按空格继续">
        <canvas id="stage" aria-hidden="true"></canvas>
        <div class="backdrop" id="backdrop" aria-hidden="true" hidden>
          <img alt="" decoding="async">
          <video muted playsinline loop preload="auto"></video>
        </div>
        <div class="curtain" id="curtain" aria-hidden="true"></div>
        <video id="scene-transition" muted playsinline preload="metadata" aria-hidden="true" hidden></video>
        <div class="grain" id="grain" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <p class="caption" id="caption" hidden></p>
        <p class="toast" id="toast" role="status" hidden></p>
        <p class="sound-caption" id="sound-caption" role="status" hidden></p>
        <div class="card" id="card" hidden></div>
        <aside class="clue" id="clue" aria-live="polite" hidden></aside>
        <div class="subtitle" id="subtitle" aria-live="polite" hidden></div>
        <div class="choices" id="choices" hidden></div>
        <div class="meters" id="meters" hidden></div>
        <div class="hud">
          <span class="chances" id="chances" title="还可以退回上一个选择 3 次">机会 ●●●</span>
          <button class="notes-toggle" id="notes-toggle" type="button" aria-controls="notebook" aria-expanded="false">笔记 <span id="notes-count">0</span></button>
        </div>
        <div class="intro" id="intro">
          <p class="intro-kicker">TaleLoom 织境 · 影像模式</p>
          <h1>雾港旧案</h1>
          <p class="intro-sub">一九三一年 · 雾港</p>
          <button class="begin" id="begin" type="button">开始（建议开启声音）</button>
          <button class="begin secondary" id="resume" type="button" hidden>从存档点继续</button>
        </div>
      </div>
      <aside class="desk" id="desk" aria-label="调查台" hidden></aside>
      <aside class="notebook" id="notebook" aria-label="随身笔记" hidden>
        <header class="nb-header">
          <h2>随身笔记</h2>
          <button class="nb-close" id="notebook-close" type="button">合上 <kbd>Esc</kbd></button>
        </header>
        <div class="nb-body" id="notebook-body"></div>
        <p class="nb-foot">翻看笔记不会推进剧情，字幕会在合上后继续。</p>
      </aside>
    </div>
    <nav class="controls" aria-label="播放控制">
      <button id="skip" type="button">继续剧情 <kbd>空格</kbd></button>
      <button id="notes-btn" type="button">线索笔记 <kbd>N</kbd></button>
      <button id="mute" type="button" aria-pressed="false">声音：开</button>
      <button id="voice" type="button" aria-pressed="false">配音：开</button>
      <label class="volume">音量 <input id="volume" type="range" min="0" max="100" step="5" value="80"></label>
      <button id="restart" type="button">重新开始</button>
      <a href="/">返回文字版</a>
    </nav>
    <p class="note-line">点击画面或按空格继续剧情；数字键 1–9 选择，N 查看笔记。重要声音配有文字说明。</p>
  </main>
  <script type="module" src="/web/cinematic/app.js"></script>
</body>
</html>
